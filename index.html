<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 小工具 · Web Tools</title>
<meta name="description" content="一个纯前端、零依赖、离线可用的 HTML 小工具合集。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230071e3'/><path d='M13 12l-2.5 4L13 20M19 12l2.5 4L19 20' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #86868b;
    --line: rgba(0, 0, 0, .08);
    --line-2: rgba(0, 0, 0, .05);
    --accent: #0071e3;

    --radius-lg: 20px;
    --radius-icon: 13px;
    --pad-x: clamp(20px, 4vw, 24px);
    --pad-card: clamp(20px, 2.2vw, 24px);

    --shadow: 0 1px 1px rgba(0, 0, 0, .03), 0 4px 12px rgba(0, 0, 0, .04), 0 12px 28px rgba(0, 0, 0, .03);
    --shadow-hover: 0 2px 4px rgba(0, 0, 0, .04), 0 12px 28px rgba(0, 0, 0, .06), 0 28px 60px rgba(0, 0, 0, .06);
    --ease: cubic-bezier(.25, .8, .25, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body { min-height: 100vh; }

  /* ---------- 版心：1024 内容宽 + 弹性左右留白 ---------- */
  .wrap {
    max-width: 1024px;
    margin: 0 auto;
    padding: clamp(56px, 9vw, 104px) var(--pad-x) clamp(40px, 6vw, 56px);
  }

  /* ---------- Hero ---------- */
  .hero { max-width: 720px; }
  .logo {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(150deg, #5aa9ff, #0071e3);
    box-shadow: 0 6px 18px rgba(0, 113, 227, .30), inset 0 1px 0 rgba(255, 255, 255, .38);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: clamp(20px, 2.4vw, 26px);
  }
  .logo svg { width: 24px; height: 24px; color: #fff; }
  h1 {
    font-size: clamp(32px, 4.6vw, 48px);
    font-weight: 600;
    letter-spacing: -0.022em;
    line-height: 1.08;
  }
  .sub {
    margin-top: clamp(12px, 1.6vw, 18px);
    font-size: clamp(15px, 1.5vw, 19px);
    line-height: 1.55;
    letter-spacing: -0.01em;
    color: var(--text-2);
    max-width: 600px;
  }
  .sub b { font-weight: 500; color: var(--text); }

  /* ---------- 分组标题 ---------- */
  .tools { margin-top: clamp(52px, 8vw, 88px); }
  .sec-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: clamp(16px, 2vw, 22px);
  }
  .sec-head h2 {
    font-size: clamp(17px, 1.9vw, 21px);
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .sec-count {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-3);
    background: rgba(0, 0, 0, .05);
    border-radius: 999px;
    padding: 2px 9px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 工具网格：最多 3 列，小屏自动降列 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(288px, 100%), 1fr));
    gap: clamp(14px, 1.8vw, 20px);
  }

  .tool {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: var(--pad-card);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
  }
  .tool:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-hover);
    border-color: rgba(0, 0, 0, .11);
  }
  .tool:active { transform: translateY(-2px); }
  .tool:focus-visible {
    outline: none;
    box-shadow: 0 0 0 4px rgba(0, 113, 227, .28), var(--shadow);
  }

  .t-icon {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: var(--radius-icon);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    background-image: linear-gradient(150deg, rgba(255, 255, 255, .32), rgba(255, 255, 255, 0) 62%);
    box-shadow: 0 4px 12px rgba(0, 0, 0, .14);
  }
  .t-icon svg { width: 22px; height: 22px; }

  .t-arrow {
    position: absolute;
    top: var(--pad-card);
    right: var(--pad-card);
    width: 20px;
    height: 20px;
    color: var(--text-3);
    transition: color .25s var(--ease), transform .25s var(--ease);
  }
  .tool:hover .t-arrow { color: var(--accent); transform: translateX(4px); }

  .t-name {
    margin-top: 6px;
    padding-right: 28px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.2px;
    line-height: 1.3;
  }
  .t-desc {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-2);
    flex: 1;
  }
  .t-file {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid var(--line-2);
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--text-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty {
    grid-column: 1 / -1;
    padding: 44px 24px;
    text-align: center;
    font-size: 13.5px;
    color: var(--text-3);
    border: 1px dashed var(--line);
    border-radius: var(--radius-lg);
  }

  /* ---------- 页脚 ---------- */
  .foot {
    margin-top: clamp(48px, 7vw, 80px);
    padding-top: clamp(20px, 2.4vw, 26px);
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    font-size: 12.5px;
    color: var(--text-3);
    line-height: 1.7;
  }
  .foot a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-2);
    text-decoration: none;
    transition: color .2s;
  }
  .foot a:hover { color: var(--accent); }
  .foot svg { width: 15px; height: 15px; }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tool { transition: none; }
    .tool:hover { transform: none; }
    .t-arrow { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
          <path d="M9 10.5L7 12.5l2 2M15 10.5l2 2-2 2"/>
        </svg>
      </div>
      <h1>HTML 小工具</h1>
      <p class="sub">
        一堆 <b>纯前端、零依赖</b> 的小工具，每个都是独立单文件，
        不必起服务、不必联网，<b>双击就能用</b>。
      </p>
    </header>

    <section class="tools">
      <div class="sec-head">
        <h2>全部工具</h2>
        <span class="sec-count" id="count">0</span>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <footer class="foot">
      <div>单文件 · 零依赖 · 离线可用</div>
      <a href="https://github.com/ooghoo/htools" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub
      </a>
    </footer>
  </div>

<script src="tools.js"></script>
<script>
(function () {
  var ICONS = {
    byte: '<ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6"/><path d="M4.5 11.5c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    code: '<path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/>',
    text: '<path d="M4 6.5V5h16v1.5M12 5v14M8.5 19h7"/>',
    time: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.5 2"/>',
    color: '<path d="M12 3.5c4.7 0 8.5 3.4 8.5 7.6 0 2.6-2 4.4-4.4 4.4h-2.3c-1 0-1.6.7-1.6 1.6 0 .5.2.9.2 1.4 0 .9-.7 1.5-1.5 1.5-4.4 0-7.9-3.7-7.9-8.2C3 6.9 6.9 3.5 12 3.5z"/><circle cx="8" cy="9.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="9.5" r="1.3" fill="currentColor" stroke="none"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3.5 16.5l4.5-4.5 4 3.5 3.5-3 5 4.5"/>'
  };

  var grid = document.getElementById('grid');
  var countEl = document.getElementById('count');
  var list = (typeof TOOLS !== 'undefined' && Array.isArray(TOOLS)) ? TOOLS : [];

  countEl.textContent = list.length;

  if (!list.length) {
    var empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '还没有工具 —— 在 tools.js 里注册一条就会出现在这里。';
    grid.appendChild(empty);
    return;
  }

  list.forEach(function (t) {
    var svgInner = ICONS[t.icon] || ICONS.plus;
    var accent = t.accent || 'var(--accent)';

    var a = document.createElement('a');
    a.className = 'tool';
    a.href = t.file;

    var icon = document.createElement('span');
    icon.className = 't-icon';
    icon.style.backgroundColor = accent;
    icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + svgInner + '</svg>';

    var arrow = document.createElement('span');
    arrow.className = 't-arrow';
    arrow.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l7 7-7 7"/></svg>';

    var name = document.createElement('h3');
    name.className = 't-name';
    name.textContent = t.name;

    var desc = document.createElement('p');
    desc.className = 't-desc';
    desc.textContent = t.desc;

    var file = document.createElement('span');
    file.className = 't-file';
    file.textContent = t.file;

    a.appendChild(icon);
    a.appendChild(arrow);
    a.appendChild(name);
    a.appendChild(desc);
    a.appendChild(file);
    grid.appendChild(a);
  });
})();
</script>
</body>
</html>
