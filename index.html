<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字节换算 · Byte Converter</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #a1a1a6;
    --line: #e5e5ea;
    --line-2: #f0f0f2;
    --accent: #0071e3;
    --accent-soft: #e8f1fd;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 22px;
    padding: 40px 36px 32px;
  }
  .head { text-align: center; margin-bottom: 24px; }
  .head h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .head p {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-2);
  }

  /* 规则切换（Windows / Mac） */
  .seg {
    display: flex;
    background: #ececed;
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 22px;
  }
  .seg-btn {
    flex: 1;
    border: none;
    background: transparent;
    height: 34px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-2);
    cursor: pointer;
    font-family: inherit;
    transition: background .18s, color .18s, box-shadow .18s;
  }
  .seg-btn.active {
    background: #fff;
    color: var(--text);
    box-shadow: 0 1px 3px rgba(0,0,0,.10);
  }

  /* 输入区 */
  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
  }
  .num-wrap { flex: 1; position: relative; }
  .num-input {
    width: 100%;
    height: 48px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 17px;
    font-weight: 500;
    padding: 0 14px;
    color: var(--text);
    background: #fbfbfd;
    outline: none;
    transition: border-color .2s, background .2s;
    font-family: inherit;
  }
  .num-input:focus { border-color: var(--accent); background: #fff; }
  .num-input::-webkit-outer-spin-button,
  .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .unit-select {
    height: 48px;
    min-width: 120px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    padding: 0 12px 0 14px;
    color: var(--text);
    background: #fbfbfd url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%236e6e73' stroke-width='1.5' stroke-linecap='round'/></svg>") no-repeat right 14px center;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    font-family: inherit;
  }
  .unit-select:focus { border-color: var(--accent); background-color: #fff; }

  /* 结果列表 */
  .results { list-style: none; }
  .results li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 4px 13px 14px;
    border-bottom: 1px solid var(--line-2);
    gap: 12px;
    transition: background .15s;
    border-radius: 8px;
  }
  .results li:last-child { border-bottom: none; }
  .results li:hover { background: #fafafa; }
  .results li.active { background: var(--accent-soft); }
  .results li.active .u-name { color: var(--accent); }
  .u-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    flex-shrink: 0;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .u-name small {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-3);
  }
  .u-val {
    font-size: 15px;
    font-weight: 600;
    font-family: "SF Mono", "SF Pro Text", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    text-align: right;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .copy-btn {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity .15s, background .15s, color .15s;
  }
  .results li:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: var(--line); color: var(--text); }
  .copy-btn.copied { opacity: 1; color: var(--accent); }
  .copy-btn svg { width: 14px; height: 14px; }

  /* 折叠按钮 */
  .more-toggle {
    display: block;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    padding: 12px 0 8px;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    letter-spacing: 0.2px;
  }
  .more-toggle:hover { opacity: .65; }
  .more-toggle .arrow {
    display: inline-block;
    margin-left: 2px;
    transition: transform .2s;
  }
  .more-toggle.open .arrow { transform: rotate(180deg); }

  .foot {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--line-2);
    font-size: 12px;
    color: var(--text-3);
    line-height: 1.6;
    text-align: center;
  }
  .foot code {
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 11px;
    background: #f0f0f2;
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--text-2);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <h1>字节换算</h1>
      <p>输入数值，实时换算到所有单位</p>
    </div>

    <div class="seg" id="seg">
      <button class="seg-btn active" data-mode="win">Windows · 1024</button>
      <button class="seg-btn" data-mode="mac">Mac · 1000</button>
    </div>

    <div class="input-row">
      <div class="num-wrap">
        <input class="num-input" type="number" id="numInput" value="1" step="any" inputmode="decimal" placeholder="输入数值">
      </div>
      <select class="unit-select" id="unitSelect"></select>
    </div>

    <ul class="results" id="resultsMain"></ul>
    <button class="more-toggle" id="moreToggle">展开更多单位 <span class="arrow">▾</span></button>
    <ul class="results" id="resultsMore"></ul>

    <div class="foot" id="foot">
      Windows：二进制 <code>1 KB = 1024 B</code> · Mac：十进制 (SI) <code>1 KB = 1000 B</code> · <code>1 Byte = 8 bit</code>
    </div>
  </div>

<script>
(function () {
  // 单位定义，power 为该单位相对字节(Byte)的进制幂次；bit 固定为 1/8 字节
  var unitDefs = [
    { key: 'bit', name: '比特',     short: 'bit', power: null },  // bit 特殊处理
    { key: 'B',   name: '字节',     short: 'B',   power: 0 },
    { key: 'KB',  name: '千字节',   short: 'KB',  power: 1 },
    { key: 'MB',  name: '兆字节',   short: 'MB',  power: 2 },
    { key: 'GB',  name: '千兆字节', short: 'GB',  power: 3 },
    { key: 'TB',  name: '太字节',   short: 'TB',  power: 4 },
    { key: 'PB',  name: '拍字节',   short: 'PB',  power: 5 },
    { key: 'EB',  name: '艾字节',   short: 'EB',  power: 6 },
    { key: 'ZB',  name: '泽字节',   short: 'ZB',  power: 7 },
    { key: 'YB',  name: '尧字节',   short: 'YB',  power: 8 }
  ];

  // 默认展示到 TB（含），之后的单位折叠
  var CUT = 5; // 索引 <= 5 常显，> 5 折叠

  // 进制基数：Windows 二进制 1024，Mac 十进制 1000
  var base = 1024;

  function factorOf(def) {
    if (def.key === 'bit') return 1 / 8;        // bit 不受进制影响
    return Math.pow(base, def.power);
  }

  var numInput = document.getElementById('numInput');
  var unitSelect = document.getElementById('unitSelect');
  var resultsMain = document.getElementById('resultsMain');
  var resultsMore = document.getElementById('resultsMore');
  var moreToggle = document.getElementById('moreToggle');
  var seg = document.getElementById('seg');

  var expanded = false;

  // 填充下拉
  unitDefs.forEach(function (u, i) {
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = u.name + ' (' + u.short + ')';
    unitSelect.appendChild(opt);
  });
  unitSelect.value = 1; // 默认：字节 B

  function fmt(v) {
    if (v === 0) return '0.00';
    if (!isFinite(v)) return '—';
    var abs = Math.abs(v);
    if (abs > 0 && abs < 0.005) {
      return v.toExponential(2).replace('e+', 'e');
    }
    if (abs >= 1e15) {
      return v.toExponential(2).replace('e+', 'e');
    }
    return v.toFixed(2);
  }

  function buildRow(u, i, unitIdx, baseBytes) {
    var converted = baseBytes / factorOf(u);
    var li = document.createElement('li');
    if (i === unitIdx) li.className = 'active';

    var name = document.createElement('div');
    name.className = 'u-name';
    name.innerHTML = u.name + ' <small>' + u.short + '</small>';

    var valEl = document.createElement('div');
    valEl.className = 'u-val';
    valEl.textContent = fmt(converted);

    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.title = '复制';
    btn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>';
    btn.addEventListener('click', function () {
      var text = valEl.textContent;
      var tmp = document.createElement('textarea');
      tmp.value = text;
      document.body.appendChild(tmp);
      tmp.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(tmp);
      btn.classList.add('copied');
      var sv = btn.querySelector('svg');
      sv.innerHTML = '<path d="M3.5 8.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
      setTimeout(function () {
        btn.classList.remove('copied');
        sv.innerHTML = '<rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/>';
      }, 1200);
    });

    li.appendChild(name);
    li.appendChild(valEl);
    li.appendChild(btn);
    return li;
  }

  function render() {
    var raw = numInput.value.trim();
    var val = parseFloat(raw);
    var unitIdx = parseInt(unitSelect.value, 10);
    var baseBytes = (!isNaN(val) && isFinite(val)) ? val * factorOf(unitDefs[unitIdx]) : 0;

    // 若选中的单位属于折叠区，则自动展开
    if (unitIdx > CUT) expanded = true;

    resultsMain.innerHTML = '';
    resultsMore.innerHTML = '';
    unitDefs.forEach(function (u, i) {
      var row = buildRow(u, i, unitIdx, baseBytes);
      if (i <= CUT) resultsMain.appendChild(row);
      else resultsMore.appendChild(row);
    });

    resultsMore.style.display = expanded ? '' : 'none';
    moreToggle.classList.toggle('open', expanded);
    moreToggle.innerHTML = (expanded ? '收起更多单位 ' : '展开更多单位 ') + '<span class="arrow">▾</span>';
  }

  moreToggle.addEventListener('click', function () {
    expanded = !expanded;
    render();
  });

  seg.addEventListener('click', function (e) {
    var btn = e.target.closest('.seg-btn');
    if (!btn) return;
    seg.querySelectorAll('.seg-btn').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    base = (btn.dataset.mode === 'mac') ? 1000 : 1024;
    render();
  });

  numInput.addEventListener('input', render);
  unitSelect.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
